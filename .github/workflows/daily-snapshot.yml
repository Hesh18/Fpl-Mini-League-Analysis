name: Daily FPL snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FPL_RAW_DIR: ${{ github.workspace }}/datastore/raw
      FPL_PUBLISH_DIR: ${{ github.workspace }}/datastore/published

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check out data branch
        uses: actions/checkout@v6
        with:
          ref: data
          path: datastore

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download today's snapshot
        id: ingest
        run: python src/ingest.py

      - name: Build and test the warehouse
        working-directory: dbt
        run: |
          mkdir -p ../data
          dbt build

      - name: Publish marts for the app
        run: python src/publish.py

      - name: Commit and push
        if: ${{ !cancelled() && steps.ingest.outcome != 'skipped' }}
        working-directory: datastore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi