models:
  - name: mart_league_summary
    description: "One row per manager in the current league table, with season-long decision stats for the app."
    config:
      contract:
        enforced: true
    columns:
    
      - name: as_of_date
        data_type: date
      - name: latest_gameweek
        data_type: bigint
      - name: latest_gameweek_final
        data_type: boolean
        data_tests:
          - not_null
      - name: league_rank
        data_type: bigint
      - name: manager_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_type: varchar
      - name: total_points
        data_type: bigint
      - name: points_behind_leader
        data_type: bigint
      - name: gameweeks_played
        data_type: bigint
      - name: first_gameweek
        data_type: bigint
      - name: bench_points
        data_type: bigint
      - name: bench_points_per_gameweek
        data_type: double
      - name: hit_points
        data_type: bigint
      - name: transfers_made
        data_type: bigint

  - name: mart_captain_decisions
    description: "One row per manager per final gameweek: who wore the armband, the best option in the XI they picked, and the points the choice cost."
    config:
      contract:
        enforced: true
    columns:
      - name: gameweek
        data_type: bigint
        data_tests:
          - not_null
      - name: manager_id
        data_type: bigint
        data_tests:
          - not_null
      - name: team_name
        data_type: varchar
      - name: chip
        data_type: varchar
      - name: picked_captain_name
        data_type: varchar
        data_tests:
          - not_null
      - name: changed_captain
        data_type: boolean
        data_tests:
          - not_null
      - name: captain_name
        data_type: varchar
      - name: captain_points
        data_type: bigint
      - name: vice_captain_stepped_in
        data_type: boolean
      - name: best_option_name
        data_type: varchar
      - name: best_option_points
        data_type: bigint
      - name: captain_points_lost
        data_type: bigint
      - name: crowd_captain_name
        data_type: varchar
        data_tests:
          - not_null
      - name: crowd_captain_points
        data_type: bigint
        data_tests:
          - not_null
  - name: mart_top_half_weeks
    description: "One row per manager: finished gameweeks scored above the league's median (after hits), and the longest and current runs of them."
    config:
      contract:
        enforced: true
    columns:
      - name: manager_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_type: varchar
        data_tests:
          - not_null
      - name: gameweeks_played
        data_type: bigint
        data_tests:
          - not_null
      - name: top_half_weeks
        data_type: bigint
        data_tests:
          - not_null
      - name: top_half_share
        data_type: double
        data_tests:
          - not_null
      - name: longest_run
        data_type: bigint
        data_tests:
          - not_null
      - name: current_run
        data_type: bigint
        data_tests:
          - not_null
  - name: mart_player_consistency
    description: "One row per player with at least one 60-minute game: how often he scored above the median of his position, his best game, and whether he has enough games to be ranked."
    config:
      contract:
        enforced: true
    columns:
      - name: player_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: player_name
        data_type: varchar
        data_tests:
          - not_null
      - name: team_name
        data_type: varchar
        data_tests:
          - not_null
      - name: position
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["GKP", "DEF", "MID", "FWD"]
      - name: price_m
        data_type: double
      - name: full_games
        data_type: bigint
        data_tests:
          - not_null
      - name: good_games
        data_type: bigint
        data_tests:
          - not_null
      - name: good_game_share
        data_type: double
        data_tests:
          - not_null
      - name: best_game
        data_type: bigint
        data_tests:
          - not_null
      - name: is_ranked
        data_type: boolean
        data_tests:
          - not_null